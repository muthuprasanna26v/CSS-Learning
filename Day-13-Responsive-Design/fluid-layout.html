<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Layout</title>
    <link rel="stylesheet" href="fluid-layout.css">
</head>
<body>
    <div class="container">
        <h1>Fluid Layout</h1>
        
        <div class="layout">
            <aside class="sidebar">
                <h3>Sidebar</h3>
                <p>25% width</p>
            </aside>
            <main class="main">
                <h3>Main Content</h3>
                <p>75% width</p>
                <p>This layout uses percentage-based widths to create a fluid design that adapts to different screen sizes.</p>
            </main>
        </div>
        
        <div class="two-column">
            <div class="col">
                <h3>Column 1</h3>
                <p>50% width</p>
            </div>
            <div class="col">
                <h3>Column 2</h3>
                <p>50% width</p>
            </div>
        </div>
    </div>
</body>
</html>
