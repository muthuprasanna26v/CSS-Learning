<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Basics</title>
    <link rel="stylesheet" href="responsive-basics.css">
</head>
<body>
    <div class="container">
        <h1>Responsive Design Basics</h1>
        
        <h2>Fluid Container</h2>
        <div class="fluid-container">
            <p>This container uses max-width and percentage-based sizing to be responsive.</p>
        </div>
        
        <h2>Responsive Images</h2>
        <div class="image-container">
            <img src="https://via.placeholder.com/800x400" alt="Responsive image" class="responsive-img">
        </div>
        
        <h2>Flexible Grid</h2>
        <div class="flexible-grid">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
            <div class="item">Item 4</div>
        </div>
    </div>
</body>
</html>
