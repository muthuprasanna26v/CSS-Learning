<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Rows</title>
    <link rel="stylesheet" href="grid-rows.css">
</head>
<body>
    <div class="container">
        <h1>Grid Template Rows</h1>
        
        <h2>Fixed Rows</h2>
        <div class="grid fixed-rows">
            <div class="item">Row 1 - 100px</div>
            <div class="item">Row 2 - 100px</div>
            <div class="item">Row 3 - 100px</div>
        </div>
        
        <h2>Auto Rows</h2>
        <div class="grid auto-rows">
            <div class="item">Auto</div>
            <div class="item">Auto</div>
            <div class="item">Auto</div>
        </div>
        
        <h2>Mixed Rows</h2>
        <div class="grid mixed-rows">
            <div class="item">100px</div>
            <div class="item">Auto</div>
            <div class="item">150px</div>
        </div>
    </div>
</body>
</html>
