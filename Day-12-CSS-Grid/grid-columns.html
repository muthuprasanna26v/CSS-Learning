<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Columns</title>
    <link rel="stylesheet" href="grid-columns.css">
</head>
<body>
    <div class="container">
        <h1>Grid Template Columns</h1>
        
        <h2>Fixed Columns</h2>
        <div class="grid fixed-columns">
            <div class="item">200px</div>
            <div class="item">200px</div>
            <div class="item">200px</div>
        </div>
        
        <h2>Fraction Columns</h2>
        <div class="grid fraction-columns">
            <div class="item">1fr</div>
            <div class="item">1fr</div>
            <div class="item">1fr</div>
        </div>
        
        <h2>Mixed Columns</h2>
        <div class="grid mixed-columns">
            <div class="item">200px</div>
            <div class="item">1fr</div>
            <div class="item">100px</div>
        </div>
        
        <h2>Repeat Function</h2>
        <div class="grid repeat-columns">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
        </div>
        
        <h2>Auto Fit</h2>
        <div class="grid auto-fit">
            <div class="item">Auto</div>
            <div class="item">Auto</div>
            <div class="item">Auto</div>
            <div class="item">Auto</div>
        </div>
    </div>
</body>
</html>
