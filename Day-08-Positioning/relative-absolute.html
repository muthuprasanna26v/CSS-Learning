<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative and Absolute</title>
    <link rel="stylesheet" href="relative-absolute.css">
</head>
<body>
    <div class="container">
        <h1>Relative + Absolute Positioning</h1>
        
        <div class="card">
            <h3>Card with Icon</h3>
            <p>This card has an icon positioned absolutely relative to the card.</p>
            <div class="icon">★</div>
        </div>
        
        <div class="card">
            <h3>Another Card</h3>
            <p>Icons can be positioned in different corners.</p>
            <div class="icon icon-bottom-right">★</div>
        </div>
    </div>
</body>
</html>
