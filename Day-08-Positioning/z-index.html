<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <link rel="stylesheet" href="z-index.css">
</head>
<body>
    <div class="container">
        <h1>Z-Index Stacking Order</h1>
        
        <div class="stacking-container">
            <div class="box box-1">Box 1 (z-index: 1)</div>
            <div class="box box-2">Box 2 (z-index: 2)</div>
            <div class="box box-3">Box 3 (z-index: 3)</div>
        </div>
        
        <h2>Without Z-Index</h2>
        <div class="stacking-container">
            <div class="box no-index-1">Box 1 (no z-index)</div>
            <div class="box no-index-2">Box 2 (no z-index)</div>
            <div class="box no-index-3">Box 3 (no z-index)</div>
        </div>
    </div>
</body>
</html>
