<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <link rel="stylesheet" href="borders.css">
</head>
<body>
    <div class="container">
        <h1>CSS Borders</h1>
        
        <h2>Border Styles</h2>
        <div class="box solid">Solid</div>
        <div class="box dashed">Dashed</div>
        <div class="box dotted">Dotted</div>
        <div class="box double">Double</div>
        
        <h2>Border Width</h2>
        <div class="box thin">Thin (1px)</div>
        <div class="box medium">Medium (3px)</div>
        <div class="box thick">Thick (5px)</div>
        
        <h2>Border Radius</h2>
        <div class="box radius-small">Small radius (5px)</div>
        <div class="box radius-medium">Medium radius (15px)</div>
        <div class="box radius-large">Large radius (30px)</div>
        <div class="box circle">Circle (50%)</div>
        
        <h2>Individual Borders</h2>
        <div class="box border-top">Top border only</div>
        <div class="box border-sides">Left and right borders</div>
        <div class="box border-bottom">Bottom border only</div>
    </div>
</body>
</html>
