<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Cards</title>
    <link rel="stylesheet" href="cards.css">
</head>
<body>
    <div class="container">
        <h1>Modern UI Cards</h1>
        
        <div class="card card-1">
            <h3>Gradient Card</h3>
            <p>Beautiful gradient background with shadow.</p>
        </div>
        
        <div class="card card-2">
            <h3>Rounded Card</h3>
            <p>Large border radius with soft shadow.</p>
        </div>
        
        <div class="card card-3">
            <h3>Bordered Card</h3>
            <p>Styled border with hover effect.</p>
        </div>
        
        <div class="card card-4">
            <h3>Glow Card</h3>
            <p>Colored shadow for glow effect.</p>
        </div>
    </div>
</body>
</html>
