<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <link rel="stylesheet" href="shadows.css">
</head>
<body>
    <div class="container">
        <h1>CSS Shadows</h1>
        
        <h2>Box Shadow</h2>
        <div class="card shadow-small">Small shadow</div>
        <div class="card shadow-medium">Medium shadow</div>
        <div class="card shadow-large">Large shadow</div>
        
        <h2>Colored Shadows</h2>
        <div class="card shadow-blue">Blue shadow</div>
        <div class="card shadow-red">Red shadow</div>
        <div class="card shadow-green">Green shadow</div>
        
        <h2>Inner Shadow</h2>
        <div class="card shadow-inner">Inner shadow</div>
        
        <h2>Text Shadow</h2>
        <p class="text-shadow-1">Simple text shadow</p>
        <p class="text-shadow-2">Multiple text shadows</p>
        <p class="text-shadow-3">Glow effect</p>
    </div>
</body>
</html>
