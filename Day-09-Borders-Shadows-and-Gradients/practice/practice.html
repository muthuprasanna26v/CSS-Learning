<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Cards Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-icon">★</div>
            <h3>Premium Plan</h3>
            <p class="price">$29/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
            <button>Choose Plan</button>
        </div>
        
        <div class="card featured">
            <div class="badge">Popular</div>
            <div class="card-icon">★★★</div>
            <h3>Pro Plan</h3>
            <p class="price">$49/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
            </ul>
            <button>Choose Plan</button>
        </div>
        
        <div class="card">
            <div class="card-icon">★★</div>
            <h3>Basic Plan</h3>
            <p class="price">$19/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
            </ul>
            <button>Choose Plan</button>
        </div>
    </div>
</body>
</html>
