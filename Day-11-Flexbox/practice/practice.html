<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">FlexSite</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    
    <div class="hero">
        <div class="hero-content">
            <h1>Build with Flexbox</h1>
            <p>Create flexible and responsive layouts with CSS Flexbox.</p>
            <button class="btn">Learn More</button>
        </div>
    </div>
    
    <div class="container">
        <div class="pricing">
            <div class="price-card">
                <h3>Basic</h3>
                <p class="price">$19</p>
                <ul>
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                </ul>
                <button>Choose</button>
            </div>
            <div class="price-card featured">
                <h3>Pro</h3>
                <p class="price">$49</p>
                <ul>
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                    <li>Feature 3</li>
                </ul>
                <button>Choose</button>
            </div>
            <div class="price-card">
                <h3>Enterprise</h3>
                <p class="price">$99</p>
                <ul>
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                    <li>Feature 3</li>
                    <li>Feature 4</li>
                </ul>
                <button>Choose</button>
            </div>
        </div>
    </div>
</body>
</html>
