<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Basics</title>
    <link rel="stylesheet" href="flexbox-basics.css">
</head>
<body>
    <div class="container">
        <h1>Flexbox Basics</h1>
        
        <h2>Display: Flex</h2>
        <div class="flex-container">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
        
        <h2>Flex Direction: Row</h2>
        <div class="flex-container direction-row">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Flex Direction: Column</h2>
        <div class="flex-container direction-column">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Flex Direction: Row Reverse</h2>
        <div class="flex-container direction-row-reverse">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </div>
</body>
</html>
