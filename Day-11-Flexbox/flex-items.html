<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Items</title>
    <link rel="stylesheet" href="flex-items.css">
</head>
<body>
    <div class="container">
        <h1>Flex Item Properties</h1>
        
        <h2>Flex Grow</h2>
        <div class="flex-container grow">
            <div class="item grow-1">Grow 1</div>
            <div class="item grow-2">Grow 2</div>
            <div class="item grow-3">Grow 3</div>
        </div>
        
        <h2>Flex Shrink</h2>
        <div class="flex-container shrink">
            <div class="item shrink-1">Shrink 1</div>
            <div class="item shrink-0">Shrink 0</div>
            <div class="item shrink-1">Shrink 1</div>
        </div>
        
        <h2>Flex Basis</h2>
        <div class="flex-container basis">
            <div class="item basis-100">Basis 100px</div>
            <div class="item basis-200">Basis 200px</div>
            <div class="item basis-auto">Basis Auto</div>
        </div>
        
        <h2>Align Self</h2>
        <div class="flex-container align-self">
            <div class="item self-start">Start</div>
            <div class="item self-center">Center</div>
            <div class="item self-end">End</div>
        </div>
        
        <h2>Order</h2>
        <div class="flex-container order">
            <div class="item order-3">Order 3</div>
            <div class="item order-1">Order 1</div>
            <div class="item order-2">Order 2</div>
        </div>
    </div>
</body>
</html>
