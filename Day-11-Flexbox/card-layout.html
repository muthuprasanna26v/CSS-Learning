<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <link rel="stylesheet" href="card-layout.css">
</head>
<body>
    <div class="container">
        <h1>Flexbox Card Layout</h1>
        
        <div class="card-container">
            <div class="card">
                <h3>Card 1</h3>
                <p>This is the first card in the flexbox layout.</p>
            </div>
            <div class="card">
                <h3>Card 2</h3>
                <p>This is the second card in the flexbox layout.</p>
            </div>
            <div class="card">
                <h3>Card 3</h3>
                <p>This is the third card in the flexbox layout.</p>
            </div>
            <div class="card">
                <h3>Card 4</h3>
                <p>This is the fourth card in the flexbox layout.</p>
            </div>
        </div>
    </div>
</body>
</html>
