<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Alignment</title>
    <link rel="stylesheet" href="flex-alignment.css">
</head>
<body>
    <div class="container">
        <h1>Flexbox Alignment</h1>
        
        <h2>Justify Content: Flex Start</h2>
        <div class="flex-container justify-start">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Justify Content: Center</h2>
        <div class="flex-container justify-center">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Justify Content: Flex End</h2>
        <div class="flex-container justify-end">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Justify Content: Space Between</h2>
        <div class="flex-container justify-between">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Justify Content: Space Around</h2>
        <div class="flex-container justify-around">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
        
        <h2>Align Items: Center</h2>
        <div class="flex-container align-center">
            <div class="item tall">Tall</div>
            <div class="item">Normal</div>
            <div class="item short">Short</div>
        </div>
        
        <h2>Align Items: Stretch</h2>
        <div class="flex-container align-stretch">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </div>
</body>
</html>
