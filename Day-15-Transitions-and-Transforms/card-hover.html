<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="card-hover.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-image">Card Image</div>
            <div class="card-body">
                <h3>Card Title</h3>
                <p>Hover over this card to view smooth lift, image scale, and shadow transition effects.</p>
            </div>
        </div>
    </div>
</body>
</html>
