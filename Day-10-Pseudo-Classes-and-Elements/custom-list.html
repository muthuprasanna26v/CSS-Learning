<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom List</title>
    <link rel="stylesheet" href="custom-list.css">
</head>
<body>
    <div class="container">
        <h1>Custom List Styling</h1>
        
        <h2>Numbered List with Counter</h2>
        <ol class="custom-numbered">
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
            <li>Fourth item</li>
        </ol>
        
        <h2>Task List</h2>
        <ul class="task-list">
            <li>Completed task</li>
            <li>Pending task</li>
            <li>Completed task</li>
            <li>Pending task</li>
        </ul>
        
        <h2>Card List</h2>
        <div class="card-list">
            <div class="card-item">Card 1</div>
            <div class="card-item">Card 2</div>
            <div class="card-item">Card 3</div>
        </div>
    </div>
</body>
</html>
