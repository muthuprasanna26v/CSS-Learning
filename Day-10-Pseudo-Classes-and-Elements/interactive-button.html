<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Buttons</title>
    <link rel="stylesheet" href="interactive-button.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Buttons</h1>
        
        <button class="btn btn-primary">Primary Button</button>
        <button class="btn btn-secondary">Secondary Button</button>
        <button class="btn btn-success">Success Button</button>
        
        <h2>Link Buttons</h2>
        <a href="#" class="link-btn">Link Button</a>
        <a href="#" class="link-btn visited">Visited Link</a>
        
        <h2>Form States</h2>
        <input type="text" class="form-input" placeholder="Normal input">
        <input type="text" class="form-input" value="Disabled input" disabled>
        <input type="text" class="form-input" value="Required input" required>
        
        <h2>Checkbox States</h2>
        <label>
            <input type="checkbox" class="custom-checkbox"> Checkbox
        </label>
        <label>
            <input type="checkbox" class="custom-checkbox" checked> Checked
        </label>
    </div>
</body>
</html>
