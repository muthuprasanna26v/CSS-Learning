<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body>
    <h1 style="color: blue; text-align: center;">Inline CSS Example</h1>
    <p style="color: green; font-size: 18px;">This paragraph has inline styles.</p>
    <p style="color: red; font-size: 20px; font-weight: bold;">This paragraph also has inline styles.</p>
    <div style="background-color: yellow; padding: 20px; margin: 10px;">
        <p style="color: purple;">This div has a yellow background.</p>
    </div>
</body>
</html>
