<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External CSS Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>External CSS Example</h1>
        <p>This page uses an external stylesheet.</p>
        <p class="highlight">This paragraph has a highlight class.</p>
        <div class="card">
            <h2>Card Title</h2>
            <p>This is a card component styled with external CSS.</p>
        </div>
        <div class="card">
            <h2>Another Card</h2>
            <p>Cards are reusable components.</p>
        </div>
    </div>
</body>
</html>
