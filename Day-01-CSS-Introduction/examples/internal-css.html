<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Example</title>
    <style>
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }
        
        h1 {
            color: darkblue;
            text-align: center;
        }
        
        .highlight {
            color: red;
            font-weight: bold;
        }
        
        #special {
            background-color: yellow;
            padding: 15px;
            border: 2px solid black;
        }
        
        p {
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Internal CSS Example</h1>
    <p>This is a normal paragraph with internal CSS styling.</p>
    <p class="highlight">This paragraph has a highlight class.</p>
    <div id="special">
        <p>This div has an ID selector with special styling.</p>
    </div>
</body>
</html>
