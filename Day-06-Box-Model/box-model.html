<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="box-model.css">
</head>
<body>
    <div class="container">
        <h1>CSS Box Model</h1>
        
        <h2>Visual Box Model</h2>
        <div class="box-model-demo">
            <div class="margin">Margin
                <div class="border">Border
                    <div class="padding">Padding
                        <div class="content">Content</div>
                    </div>
                </div>
            </div>
        </div>
        
        <h2>Content Only</h2>
        <div class="box content-only">Content only (200px)</div>
        
        <h2>With Padding</h2>
        <div class="box with-padding">Content + Padding</div>
        
        <h2>With Border</h2>
        <div class="box with-border">Content + Padding + Border</div>
        
        <h2>With Margin</h2>
        <div class="box with-margin">Content + Padding + Border + Margin</div>
    </div>
</body>
</html>
