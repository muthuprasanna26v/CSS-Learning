<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card card-1">
            <h3>Content Box</h3>
            <p>This card uses content-box sizing. Padding and border add to the total width.</p>
        </div>
        
        <div class="card card-2">
            <h3>Border Box</h3>
            <p>This card uses border-box sizing. Padding and border are included in the width.</p>
        </div>
        
        <div class="card card-3">
            <h3>Large Padding</h3>
            <p>This card has generous padding for better spacing and readability.</p>
        </div>
    </div>
</body>
</html>
