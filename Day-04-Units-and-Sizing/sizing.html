<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing Properties</title>
    <link rel="stylesheet" href="sizing.css">
</head>
<body>
    <div class="container">
        <h1>CSS Sizing Properties</h1>
        
        <h2>Width and Height</h2>
        <div class="box fixed-size">Fixed: 300px x 100px</div>
        
        <h2>Min-Width and Max-Width</h2>
        <div class="box min-max-width">Min: 200px, Max: 500px</div>
        
        <h2>Min-Height and Max-Height</h2>
        <div class="box min-max-height">Min: 100px, Max: 200px</div>
        
        <h2>Auto Width</h2>
        <div class="box auto-width">Auto width (fills container)</div>
        
        <h2>Percentage Width</h2>
        <div class="box percent-width">75% width</div>
    </div>
</body>
</html>
