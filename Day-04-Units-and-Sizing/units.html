<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <link rel="stylesheet" href="units.css">
</head>
<body>
    <div class="container">
        <h1>CSS Units</h1>
        
        <h2>Pixels (px)</h2>
        <div class="box px-box">200px width</div>
        
        <h2>Percentage (%)</h2>
        <div class="box percent-box">50% width</div>
        
        <h2>EM (relative to parent font-size)</h2>
        <div class="em-parent">
            <div class="box em-box">2em width</div>
        </div>
        
        <h2>REM (relative to root font-size)</h2>
        <div class="box rem-box">2rem width</div>
        
        <h2>Viewport Width (vw)</h2>
        <div class="box vw-box">50vw width</div>
        
        <h2>Viewport Height (vh)</h2>
        <div class="box vh-box">30vh height</div>
        
        <h2>VMIN (smaller of vw or vh)</h2>
        <div class="box vmin-box">20vmin</div>
        
        <h2>VMAX (larger of vw or vh)</h2>
        <div class="box vmax-box">20vmax</div>
    </div>
</body>
</html>
