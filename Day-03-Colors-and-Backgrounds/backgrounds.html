<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backgrounds</title>
    <link rel="stylesheet" href="backgrounds.css">
</head>
<body>
    <div class="container">
        <h1>CSS Background Properties</h1>
        
        <h2>Background Color</h2>
        <div class="box bg-color">Background Color</div>
        
        <h2>Background Image</h2>
        <div class="box bg-image">Background Image</div>
        
        <h2>Background Repeat</h2>
        <div class="box bg-repeat-no">No Repeat</div>
        <div class="box bg-repeat-x">Repeat X</div>
        <div class="box bg-repeat-y">Repeat Y</div>
        
        <h2>Background Position</h2>
        <div class="box bg-position-center">Center</div>
        <div class="box bg-position-right">Right</div>
        
        <h2>Background Size</h2>
        <div class="box bg-size-cover">Cover</div>
        <div class="box bg-size-contain">Contain</div>
        
        <h2>Background Attachment</h2>
        <div class="box bg-attachment-fixed">Fixed (scroll to see effect)</div>
        <div class="box bg-attachment-scroll">Scroll</div>
    </div>
</body>
</html>
