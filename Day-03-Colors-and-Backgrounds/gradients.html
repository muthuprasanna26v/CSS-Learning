<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <link rel="stylesheet" href="gradients.css">
</head>
<body>
    <div class="container">
        <h1>CSS Gradients</h1>
        
        <h2>Linear Gradient</h2>
        <div class="box linear-1">To Right</div>
        <div class="box linear-2">To Bottom</div>
        <div class="box linear-3">Diagonal</div>
        <div class="box linear-4">Multi-color</div>
        
        <h2>Radial Gradient</h2>
        <div class="box radial-1">Circle</div>
        <div class="box radial-2">Ellipse</div>
        <div class="box radial-3">Multi-color</div>
        
        <h2>Conic Gradient</h2>
        <div class="box conic-1">Basic</div>
        <div class="box conic-2">Multi-color</div>
    </div>
</body>
</html>
