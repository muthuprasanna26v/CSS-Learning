<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Modal Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#demo-modal" class="modal-trigger-btn">Open Modal</a>

    <div id="demo-modal" class="modal-overlay">
        <div class="modal-box">
            <a href="#" class="modal-close">&times;</a>
            <h3>Pure CSS Modal</h3>
            <p>This modal dialog operates cleanly using CSS target pseudoclass without JavaScript.</p>
        </div>
    </div>
</body>
</html>
