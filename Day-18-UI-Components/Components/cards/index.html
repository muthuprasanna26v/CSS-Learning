<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-grid">
        <article class="ui-card">
            <header class="card-header">CSS Grid & Flexbox</header>
            <div class="card-body">
                <p>Learn layout systems with reusable modular component design patterns.</p>
            </div>
            <footer class="card-footer">
                <button class="card-btn">Read More</button>
            </footer>
        </article>
    </div>
</body>
</html>
